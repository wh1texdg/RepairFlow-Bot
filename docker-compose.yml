services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repairflow
      POSTGRES_USER: repairflow
      POSTGRES_PASSWORD: repairflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairflow -d repairflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build: .
    command: python -m app.bot.main
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: .
    command: python -m app.scheduler.runner
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
